[build]
command = "npm run build && npm run check"
publish = "dist"

[build.environment]
NODE_VERSION = "24"
PUBLIC_INDEXABLE = "false"
PUBLIC_FORM_ENABLED = "false"

[context.production.environment]
PUBLIC_FORM_ENABLED = "true"

[[redirects]]
from = "/"
to = "/es/"
status = 302
force = true
conditions = { Language = ["es"] }

[[redirects]]
from = "/"
to = "/en/"
status = 302
force = true
conditions = { Language = ["en"] }

# Country is a fallback when the preferred language is neither Spanish nor English.
[[redirects]]
from = "/"
to = "/es/"
status = 302
force = true
conditions = { Country = ["AR", "BO", "CL", "CO", "CR", "CU", "DO", "EC", "ES", "GQ", "GT", "HN", "MX", "NI", "PA", "PE", "PR", "PY", "SV", "UY", "VE"] }

[[redirects]]
from = "/"
to = "/en/"
status = 302
force = true

[[headers]]
for = "/fonts/*"
[headers.values]
Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
for = "/admin/*"
[headers.values]
X-Robots-Tag = "noindex, nofollow"
Cache-Control = "no-cache"

[[headers]]
for = "/es/gracias/*"
[headers.values]
X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/en/thank-you/*"
[headers.values]
X-Robots-Tag = "noindex, nofollow"

[context.deploy-preview.environment]
PUBLIC_INDEXABLE = "false"
PUBLIC_FORM_ENABLED = "false"

[context.branch-deploy.environment]
PUBLIC_INDEXABLE = "false"
PUBLIC_FORM_ENABLED = "false"
