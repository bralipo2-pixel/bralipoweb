backend:
  name: github
  repo: bralipo2-pixel/bralipoweb
  branch: main
local_backend:
  url: http://localhost:8081/api/v1
locale: es
publish_mode: editorial_workflow
media_folder: public/images/uploads
public_folder: /images/uploads
logo_url: /images/isologoblack.png
slug:
  encoding: ascii
  clean_accents: true
collections:
  - name: projects
    label: Proyectos
    label_singular: Proyecto
    folder: src/content/projects
    create: true
    format: json
    extension: json
    slug: '{{fields.slug}}'
    summary: '{{title}}'
    preview_path: 'es/proyectos/{{slug}}/'
    fields: &entry_fields
      - {label: Nombre, name: title, widget: string}
      - {label: URL permanente, name: slug, widget: string, hint: 'Usá letras minúsculas, números y guiones. No cambiar después de publicar sin crear una redirección.', pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Solo letras minúsculas, números y guiones.']}
      - {label: Categoría, name: category, widget: select, options: [branding, web, apps, influencers]}
      - {label: Publicado, name: published, widget: boolean, default: false}
      - {label: Fecha de publicación, name: date, widget: datetime, default: '{{now}}', hint: 'El inicio muestra los cuatro proyectos publicados con fecha más reciente.'}
      - {label: Contenido de prueba, name: demo, widget: boolean, default: false, hint: 'Los ejemplos se excluyen de la versión indexable.'}
      - {label: Destacado, name: featured, widget: boolean, default: true}
      - {label: Orden, name: order, widget: number, default: 10, value_type: int, min: 0}
      - {label: Estado, name: status, widget: select, options: [experiment, prototype, live], default: experiment, required: false}
      - {label: Portada, name: cover, widget: image}
      - {label: Enlace externo, name: external, widget: string, required: false, pattern: ['^https://', 'Usá un enlace HTTPS.']}
      - label: Español
        name: es
        widget: object
        fields: &localized_fields
          - {label: Resumen, name: summary, widget: text}
          - {label: Descripción del caso, name: description, widget: text, hint: 'Separá párrafos con una línea en blanco.'}
          - {label: Servicios o áreas, name: scope, widget: string}
          - {label: Tu participación y colaboradores, name: role, widget: text}
          - {label: Descripción accesible de la portada, name: alt, widget: string}
          - {label: Título SEO, name: seoTitle, widget: string, hint: 'Nombre y enfoque del caso. Bralipo se agrega automáticamente.'}
          - {label: Descripción SEO, name: seoDescription, widget: text}
      - label: English
        name: en
        widget: object
        fields: *localized_fields
      - label: Galería
        name: gallery
        widget: list
        required: false
        fields:
          - {label: Imagen, name: image, widget: image}
          - label: Español
            name: es
            widget: object
            fields: &gallery_fields
              - {label: Texto alternativo, name: alt, widget: string}
              - {label: Pie de imagen, name: caption, widget: string, required: false}
          - label: English
            name: en
            widget: object
            fields: *gallery_fields
      - label: Contenido adicional
        name: blocks
        widget: list
        required: false
        hint: 'Agregá y ordená bloques de texto o videos. Aparecen después de la galería.'
        types:
          - label: Texto
            name: text
            widget: object
            fields:
              - label: Español
                name: es
                widget: object
                fields: &text_block_fields
                  - {label: Título, name: title, widget: string, required: false}
                  - {label: Texto, name: body, widget: text, hint: 'Separá los párrafos con una línea en blanco. Usá texto simple, sin HTML.'}
              - label: English
                name: en
                widget: object
                fields: *text_block_fields
          - label: Video de YouTube
            name: video
            widget: object
            fields:
              - {label: Enlace de YouTube, name: url, widget: string, hint: 'Pegá Compartir > Copiar enlace; también admite Shorts. No pegues el código iframe.', pattern: ['^https://(?:(?:www\.|m\.)?youtube\.com/(?:watch\?(?:[^#]*&)?v=[A-Za-z0-9_-]{11}(?:[&#].*)?|(?:shorts|embed|live)/[A-Za-z0-9_-]{11}/?(?:[?#].*)?)|youtu\.be/[A-Za-z0-9_-]{11}(?:[?#].*)?)$', 'Pegá un enlace HTTPS de un video de YouTube o Shorts.']}
              - label: Formato
                name: format
                widget: select
                default: horizontal
                options: [{label: 'Horizontal (16:9)', value: horizontal}, {label: 'Vertical / Shorts (9:16)', value: vertical}]
              - label: Español
                name: es
                widget: object
                fields: &video_block_fields
                  - {label: Título del video, name: title, widget: string}
                  - {label: Descripción breve, name: caption, widget: text, required: false}
              - label: English
                name: en
                widget: object
                fields: *video_block_fields
  - name: labs
    label: Labs
    label_singular: Exploración
    folder: src/content/labs
    create: true
    format: json
    extension: json
    slug: '{{fields.slug}}'
    summary: '{{title}}'
    preview_path: 'es/labs/{{slug}}/'
    fields: *entry_fields
